name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel a superseded run when a newer commit lands on the same ref, instead of
# letting redundant runs pile up. The local pre-push gate is the real gate, so
# only the latest commit in a burst needs its cloud check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The suite is split across three parallel jobs (2026-07). The old single job
# ran the full ~21k-test suite single-threaded (CI caps workers to 1 to dodge a
# vitest reporter-IPC timeout) and took >25min, tripping timeout-minutes with no
# verdict. Each lane now fits with room to spare:
#   - unit         fast, OS-independent tests (everything except *.integration)
#   - integration  the *.integration.test.ts files — subprocess-spawning /
#                  Linux-sensitive tests, exactly what a Linux runner uniquely
#                  validates over the dev's macOS pre-push gate
#   - package      build + release-shape checks + the new-user install smokes
# macOS stays dropped (bills 10x, redundant with the local macOS pre-push gate);
# ubuntu is the irreplaceable Linux leg. See docs/harness.md + the CI<->pre-push
# parity test (src/__tests__/ci-pipeline-parity.integration.test.ts).
jobs:
  unit:
    name: unit ${{ matrix.shard }} (Linux / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Sharded 2026-07-29. Originally added on a queue-depth theory of the
    # 25-minute lane hangs; the sharded run then isolated TWO hanging files at
    # once and falsified it — the real cause was per-FILE: tests probing
    # "/proc/…" as an unwritable path, where recursive mkdir spins forever on
    # the Linux runner (guard-state.test.ts finding 2026-06; fixed at the root
    # in every file, runs 30410747800/30412876710/30466905490). Sharding
    # STAYS on its two remaining merits: parallel wall-clock (~3x), and blast
    # radius — a future hanging file times out one ~320-file shard while the
    # other shards still report, which is exactly how the guilty files were
    # finally isolated.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runner images ship no ripgrep; without it the grep-accelerator's real-rg
      # paths diverge from every dev machine (finding 2026-06: that shipped a red
      # run). A unit test could still reach an rg path, so install it here too.
      - name: Install ripgrep (CI/dev environment parity)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ripgrep
          rg --version

      - name: Typecheck
        run: npm run typecheck:stable

      - name: Doctor formatting and readability policy
        run: |
          npm run format:check
          npm run lint:readability

      - name: Doc accuracy (landing + README vs source)
        run: npm run docs:check

      # The JSON report is the Unit 8 comparison seam (select-compare-report reads
      # every lane's failing files). Listing reporters on the CLI replaces vitest's
      # defaults, which add `github-actions` only when none are given — so it is
      # named here to keep the inline failure annotations.
      - name: Test (unit lane, shard ${{ matrix.shard }})
        run: npm run test:unit -- --shard=${{ matrix.shard }} --reporter=default --reporter=github-actions --reporter=json --outputFile.json=test-report/unit-${{ strategy.job-index }}.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-unit-${{ strategy.job-index }}
          path: test-report/
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: integration (Linux / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install ripgrep (CI/dev environment parity)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ripgrep
          rg --version

      - name: Test (integration lane)
        run: npm run test:integration -- --reporter=default --reporter=github-actions --reporter=json --outputFile.json=test-report/integration.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-integration
          path: test-report/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: e2e (Linux / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install ripgrep (CI/dev environment parity)
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - name: Resolve e2e comparison base
        run: node scripts/e2e-ci-base.mjs
      - name: Build e2e coverage artifacts
        run: npm run build:e2e
      - name: Test (e2e lane with child coverage)
        run: npm run test:e2e:coverage
      - name: Strict e2e coverage ratchet
        run: node dist/index.js coverage check --lane e2e --strict --require-measured --base "$E2E_BASE" --report coverage-e2e/coverage-summary.json
      # Unit 7/9 seam: the merged e2e coverage (istanbul JSON + summary + run
      # record) is an artifact, so a later import path has real CI evidence to
      # consume. Advisory only — nothing downstream reads it yet.
      - name: Upload e2e coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-${{ github.sha }}
          path: |
            coverage-e2e/coverage-final.json
            coverage-e2e/coverage-summary.json
            coverage-e2e/inventory.json
            coverage-e2e/run.json
          if-no-files-found: warn
          retention-days: 14

  # Unit 8 (scratch/CAMPAIGN-verification-pipeline.md): selective CI in
  # COMPARISON MODE. This job plans the change against the event's base
  # (`tests plan --base <sha>`) and runs ONLY the tests the plan says must run;
  # the full unit and integration lanes above keep running everything. The
  # report job then calls a test file that failed in the full lanes but was
  # OMITTED by the selection a SELECTION_MISS. Nothing here decides a merge and
  # neither job is a required check: promotion needs zero misses over >= 30
  # SELECTIVE, complete runs (a widened plan omits nothing, so it proves
  # nothing). Measured 2026-10-01: every plan on this repository still widens
  # to the full suite (opaque vitest config/setup), so expect `widened` rows.
  select-compare:
    name: select-compare (Linux / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install ripgrep (CI/dev environment parity)
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - name: Build CLI
        run: npm run build
      - name: Plan selected tests
        id: select
        run: node scripts/ci-select-compare.mjs select --out-dir select
      # A failing selected test is comparison data, not this job's verdict.
      - name: Run selected tests
        if: steps.select.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/ci-select-compare.mjs run-selected --out-dir select
      - name: Upload selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: select-compare-selection
          path: select/
          if-no-files-found: warn
          retention-days: 14

  select-compare-report:
    name: select-compare report (Linux / Node 22)
    runs-on: ubuntu-latest
    needs: [unit, integration, select-compare]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      # A lane that died before uploading is recorded as missing (the row is
      # `incomplete`), so an absent artifact must not fail the download.
      - name: Download test reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-*
          path: test-report
          merge-multiple: true
      - name: Download selection
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: select-compare-selection
          path: select
      - name: Compare selection with the full lanes
        run: node scripts/ci-select-compare.mjs compare --selection select/selection.json --full-reports test-report --selected-report select/selected.json --expected-lanes 4 --out select-compare-row.json
      - name: Upload comparison row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: select-compare-row-${{ github.sha }}
          path: select-compare-row.json
          if-no-files-found: warn
          retention-days: 90

  # Packaging is four jobs, not one. The old single `package` job ran SIX
  # sequential installs/builds (npm ci, build, publint --pack, attw --pack,
  # `npm pack --dry-run`, then a tarball smoke and an onboarding smoke that each
  # packed/built again) and needed a 35-minute budget: run 33822162421
  # (2026-09-04) took 11 min to reach the tarball smoke and 7 min inside it, and
  # run 36421358139 (2026-09-28) still spent 527 s on the job, the longest lane
  # of the whole workflow. Now the tarball is packed ONCE and the exact bytes
  # flow to publint, attw and the install smoke; onboarding is a separate,
  # independent fresh-source check (git clone → npm ci → build → npm link) and
  # never consumes the tarball, because that is the path a new user walks.
  package-build:
    name: package build (Linux / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npm pack` runs prepack → build, so this is the build step too.
      - name: Pack tarball
        run: |
          mkdir -p pack
          npm pack --pack-destination pack
          ls -l pack

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: interlinked-cli-tarball
          path: pack/interlinked-cli-*.tgz
          if-no-files-found: error
          retention-days: 7

  package-lint:
    name: package lint (Linux / Node 22)
    runs-on: ubuntu-latest
    needs: package-build
    timeout-minutes: 15
    # No checkout, no `npm ci`: publint and attw both accept a .tgz path, so
    # they judge the packed bytes and nothing else.
    steps:
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: interlinked-cli-tarball
          path: pack

      - name: Lint package with publint
        run: npx --yes publint run "$(ls pack/interlinked-cli-*.tgz)"

      - name: Check types with arethetypeswrong
        run: npx --yes --package=@arethetypeswrong/cli attw "$(ls pack/interlinked-cli-*.tgz)" --profile esm-only

  package-smoke:
    name: package smoke (Linux / Node 22)
    runs-on: ubuntu-latest
    needs: package-build
    # 25: the tarball smoke alone once took 7 min on a slow runner (see above);
    # this job no longer pays for the in-tree install/build before it.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: interlinked-cli-tarball
          path: pack

      # The smoke installs the downloaded tarball; it never packs or builds the
      # checkout (the checkout is only read for the contract digest and the
      # project-e2e fixture).
      - name: Tarball install smoke test
        run: INTERLINKED_TARBALL="$(ls pack/interlinked-cli-*.tgz)" bash scripts/smoke-tarball-install.sh

  onboarding:
    name: onboarding (Linux / Node 22)
    runs-on: ubuntu-latest
    # Independent of the tarball on purpose: this is the fresh-source install
    # path (git clone → npm ci → npm run build → npm link → hooks → daemon)
    # a new user walks, so it must keep doing its own install and build.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Onboarding smoke test (git-clone install path)
        env:
          # Run against the in-tree checkout so the smoke catches drift
          # introduced by the current PR before it lands. On main pushes this
          # also exercises the install path new users walk through.
          INTERLINKED_REPO_URL: ${{ github.workspace }}
          INTERLINKED_REPO_REF: HEAD
        run: bash scripts/smoke-onboarding.sh

  # The `main` ruleset requires a status check named EXACTLY
  # `package (Linux / Node 22)` (the old single job's name). This aggregate
  # keeps that contract: it always runs, and passes only when every packaging
  # job above reported `success` — `failure`, `cancelled` and `skipped` all
  # fail it, so a skipped dependency can never satisfy the required check.
  # Pinned by src/__tests__/ci-pipeline-parity.integration.test.ts.
  package:
    name: package (Linux / Node 22)
    runs-on: ubuntu-latest
    needs: [package-build, package-lint, package-smoke, onboarding]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require every packaging job to succeed
        env:
          PACKAGE_BUILD: ${{ needs.package-build.result }}
          PACKAGE_LINT: ${{ needs.package-lint.result }}
          PACKAGE_SMOKE: ${{ needs.package-smoke.result }}
          ONBOARDING: ${{ needs.onboarding.result }}
        run: bash scripts/ci-require-success.sh PACKAGE_BUILD PACKAGE_LINT PACKAGE_SMOKE ONBOARDING
